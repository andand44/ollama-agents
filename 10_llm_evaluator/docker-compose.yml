services:
  db:
    image: postgres:15-alpine
    container_name: eval_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: evals_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: eval_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/evals_db
    depends_on:
      - db
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata: